name: Sync and publish SSH MCP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Daily wake; the UTC date gate below admits every third day from 2026-10-15.
  # Unlike day-of-month */3, this remains three days across month boundaries.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sync latest stable upstream and publish after all checks (main only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ssh-mcp-container-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/develata/ssh-mcp
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  prepare:
    if: github.repository == 'Develata/ssh-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      active: ${{ steps.gate.outputs.active }}
      base: ${{ steps.candidate.outputs.base }}
      sha: ${{ steps.candidate.outputs.sha }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      version: ${{ steps.candidate.outputs.version }}
      version_tag: ${{ steps.candidate.outputs.versionTag }}
      publish: ${{ steps.candidate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: automation
      - name: Apply the three-day UTC gate
        id: gate
        working-directory: automation
        run: |
          node --input-type=module -e '
            import { scheduledDay } from "./.github/container/policy.mjs";
            import { appendFileSync } from "node:fs";
            const active = process.env.GITHUB_EVENT_NAME !== "schedule" || scheduledDay();
            appendFileSync(process.env.GITHUB_OUTPUT, "active=" + active + "\n");
            console.log(active ? "Checks are due" : "Outside the three-day UTC window");
          '
      - name: Check automation syntax and policy regressions
        if: steps.gate.outputs.active == 'true'
        working-directory: automation
        run: |
          set -euo pipefail
          node --test .github/container/policy.check.mjs
          for script in .github/container/*.mjs; do node --check "$script"; done
          shellcheck .github/container/restore.sh
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/publish-container.yml
      - name: Prepare a clean merge candidate without repository writes
        if: steps.gate.outputs.active == 'true'
        id: candidate
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          git clone --no-local --no-checkout automation source
          git -C source checkout --detach "$GITHUB_SHA"
          node automation/.github/container/prepare.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.gate.outputs.active == 'true'
        with:
          name: container-source
          path: |
            candidate.bundle
            candidate.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  source-test:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: automation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-source
      - run: bash automation/.github/container/restore.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install, build and typecheck
        working-directory: source
        run: |
          npm ci
          npm run typecheck
      - name: Enable pnpm packaging coverage
        if: runner.os == 'Linux'
        run: corepack enable
      - name: Start real SSH integration fixtures
        if: runner.os == 'Linux'
        working-directory: source
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose --profile test pull --quiet; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
          docker compose --profile test up -d --build --wait
          for port in 2222 2223 2224 2225 2226 2227; do
            ready=false
            for attempt in $(seq 1 60); do
              if nc -z 127.0.0.1 "$port"; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
          done
      - name: Full Linux suite, including integration and e2e
        if: runner.os == 'Linux'
        working-directory: source
        env:
          SSH_MCP_REQUIRE_SERVERS: '1'
          SSH_MCP_ADMIN_PASSWORD: secret
          SSH_MCP_OPERATOR_PASSWORD: oppass
          SSH_MCP_VIEWER_PASSWORD: viewpass
          SSH_MCP_ADMIN_SUDO_PASSWORD: secret
          SSH_MCP_OPERATOR_SUDO_PASSWORD: oppass
        run: npm test
      - name: Windows and macOS unit and property tests
        if: runner.os != 'Linux'
        working-directory: source
        run: npm run test:unit
      - name: SSH fixture logs
        if: failure() && runner.os == 'Linux'
        working-directory: source
        run: docker compose --profile test logs --tail=100

  validate:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: automation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-source
      - run: bash automation/.github/container/restore.sh
      - run: node automation/.github/container/package.mjs
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build without registry credentials or publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./source
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ssh-mcp:validation
      - name: Smoke test this architecture
        run: node automation/.github/container/smoke.mjs ssh-mcp:validation "$PLATFORM" "$VERSION"

  sync:
    needs: [prepare, source-test, validate]
    if: github.repository == 'Develata/ssh-mcp' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This isolated job never runs application/dependency/build scripts.
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: automation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-source
      - run: bash automation/.github/container/restore.sh
      - name: Fast-forward main to the tested candidate, never force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote=https://github.com/Develata/ssh-mcp.git
          head="$(git ls-remote "$remote" refs/heads/main | cut -f1)"
          if [ "$head" = "$SOURCE_SHA" ]; then exit 0; fi
          test "$head" = "$BASE_SHA" || { echo "::error::Main changed; rerun against its new head"; exit 1; }
          git -C source merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
          git -C source diff --exit-code "$BASE_SHA" "$SOURCE_SHA" -- .github docs/develata-container.md
          git -C source -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push "$remote" "$SOURCE_SHA:refs/heads/main"
          test "$(git ls-remote "$remote" refs/heads/main | cut -f1)" = "$SOURCE_SHA"

  publish:
    needs: [prepare, sync]
    if: github.repository == 'Develata/ssh-mcp' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: automation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-source
      - run: bash automation/.github/container/restore.sh
      - run: node automation/.github/container/package.mjs
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable tags and safely reuse completed publications
        id: existing
        run: node automation/.github/container/registry.mjs preflight
      - name: Build only a run-specific staging tag
        if: steps.existing.outputs.build == 'true'
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./source
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/develata/ssh-mcp:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=ssh-mcp
            org.opencontainers.image.description=Verified Develata packaging of SSH MCP
            org.opencontainers.image.source=https://github.com/Develata/ssh-mcp
            org.opencontainers.image.version=${{ needs.prepare.outputs.version_tag }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.licenses=MIT
            io.github.develata.ssh-mcp.upstream-revision=${{ needs.prepare.outputs.upstream }}
            io.github.develata.ssh-mcp.upstream-version=${{ needs.prepare.outputs.version }}
            io.github.develata.ssh-mcp.packaging-revision=${{ github.sha }}
      - name: Pull, inspect and smoke-test the exact digest before assigning immutable tags
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
        run: node automation/.github/container/registry.mjs verify
      - name: Retain source and digest evidence before promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-publication
          path: publication.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
      - name: Promote the verified digest to latest last
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
        run: node automation/.github/container/registry.mjs promote
